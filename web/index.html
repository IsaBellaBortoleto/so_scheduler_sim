<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Escalonamento</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>

<header id="cabecalho">
  <h1>Simulador de Escalonamento Multitarefa</h1>
  <div id="info-execucao">
    <span id="info-algoritmo">algoritmo: --</span>
    <span id="info-quantum">quantum: --</span>
    <span id="info-cpus">CPUs: --</span>
    <span id="info-tick">tick: --</span>
    <span id="info-estado-sim">--</span>
  </div>
</header>

<section id="barra-controles">
  <div class="grupo-controle">
    <label for="entrada-arquivo">arquivo de configuração</label>
    <!-- Seletor de arquivo, e nao campo de texto: o professor testa com o
         arquivo no pendrive dele, e a letra da unidade muda de maquina para
         maquina. Sem 'accept' de proposito -- o req. 3.3.4 permite
         qualquer nome de arquivo. -->
    <input type="file" id="entrada-arquivo">
    <button id="btn-carregar">carregar</button>
  </div>
  <div class="grupo-controle">
    <button id="btn-retroceder" disabled>&larr; retroceder</button>
    <button id="btn-avancar" disabled>avançar &rarr;</button>
    <button id="btn-executar-tudo" disabled>executar tudo</button>
    <button id="btn-exportar-svg" disabled>exportar SVG</button>
    <!-- Algoritmo de escalonamento. As opções vêm do C ("algoritmos" no
     estado), para um algoritmo novo aparecer aqui sem mexer no HTML
     (req. 4.2). Trocar no meio da simulação vale a partir do próximo
     tick (req. 3.1). -->
<label for="sel-algoritmo">algoritmo</label>
<select id="sel-algoritmo" disabled></select>
  </div>
</section>

<section id="area-diagnostico" hidden>
  <!-- Titulo geral de proposito: aqui aparecem os erros do arquivo, mas
       tambem a falta de resposta do programa, que nao e culpa do arquivo. -->
  <h2>mensagens</h2>
  <ul id="lista-erros" class="lista-diagnostico erros"></ul>
  <ul id="lista-avisos" class="lista-diagnostico avisos"></ul>
</section>

<main id="area-principal">

  <section id="area-gantt">
    <h2>gráfico de Gantt</h2>
    <!-- O Gantt chega PRONTO do servidor, desenhado pelo gantt.c (opcao A).
         <img> em vez de inserir o SVG com innerHTML: o navegador busca e
         desenha sozinho, e um SVG dentro de <img> nao executa script.
         A legenda vem dentro do proprio SVG, por isso nao ha legenda aqui:
         assim ela e igual na tela e no arquivo exportado. -->
    <div id="gantt-scroll">
      <img id="img-gantt" alt="gráfico de Gantt da simulação">
    </div>
  </section>

  <aside id="painel-lateral">
    <section id="painel-cpus">
      <h2>CPUs</h2>
      <table id="tabela-cpus">
        <!-- data-dica: o texto que aparece ao passar o mouse sobre o titulo
             (desenhado pelo estilo.css, ver th[data-dica]). -->
        <thead><tr>
          <th data-dica="número do processador">CPU</th>
          <th data-dica="tarefa que ocupa a CPU neste tick">tarefa</th>
          <th data-dica="quantos ticks esta CPU já passou desligada, desde o início da simulação">ticks ociosa</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Painel de edicao ANTES da tabela de tarefas: com ~190 tarefas a
         tabela fica longa, e embaixo dela o painel sairia da tela. -->
    <section id="painel-inspetor" hidden>
      <h2>editar tarefa <span id="inspetor-titulo-id"></span></h2>
      <form id="form-editar">
        <label>campo
          <select id="editar-campo">
            <option value="estado">estado</option>
            <option value="exec_restante">exec_restante</option>
            <option value="prazo">prazo</option>
            <option value="duracao">duracao</option>
          </select>
        </label>
        <label>valor
          <input type="text" id="editar-valor">
        </label>
        <button type="submit">aplicar</button>
        <button type="button" id="btn-fechar-inspetor">fechar</button>
        </form>
        <p id="inspetor-motivo" class="mensagem-erro"></p>
        </section>
        
        <section id="painel-tarefas">
          <h2>tarefas</h2>
          <table id="tabela-tarefas">
            <thead>
              <tr>
                <!-- Titulos curtos (o painel e estreito), com a notacao do
                     capitulo de tempo real (Ci, Pi, Di); o nome completo
                     aparece ao passar o mouse (atributo data-dica). -->
                <th data-dica="identificador da tarefa, como no arquivo de configuração">id</th>
                <th data-dica="estado neste tick: INATIVA, PRONTA, EXECUTANDO, SUSPENSA ou CONCLUIDA">estado</th>
                <th data-dica="ingresso: tick em que a tarefa entra no sistema">ing.</th>
                <th data-dica="Ci, tempo de computação: ticks de CPU que cada execução precisa">Ci</th>
                <th data-dica="Pi, período: a cada quantos ticks chega uma execução nova">Pi</th>
                <th data-dica="Di, prazo (deadline) relativo: em quantos ticks, contados da chegada, cada execução tem de terminar">Di</th>
                <th data-dica="Ci restante: ticks de CPU que faltam para a execução atual terminar">Ci rest.</th>
                <th data-dica="execuções (instâncias) já concluídas">concluídas</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
        
        <section id="painel-evento">
          <h2>último evento</h2>
      <p id="texto-ultimo-evento">--</p>
    </section>
  </aside>

</main>

<script src="/app.js"></script>
</body>
</html>
